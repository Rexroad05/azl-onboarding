workflow:
  phases:
    - id: 1
      name: HCNFoundationAndAzureRegistration
      display_name: "Phase 1 - HCN Foundation and Azure Registration"
      implemented: true

      stages:
        - id: 1
          name: InputAndBuildValidation
          display_name: "1.1 Input and Build Validation"
          mode: Validate
          return_to_stage: 1
          max_attempts: 1
          retry_seconds: 0
          operations:
            - Test-EnvironmentConfiguration
            - Test-NamingConvention
            - Test-IPAddressAllocation
            - Test-StorageNetworkConfiguration
            - Test-DnsConfiguration
            - Test-ActiveDirectoryConfiguration
            - Test-ExecutionHostConfiguration
            - Test-RequiredSecrets
            - Test-ReleasePackageIntegrity

        - id: 2
          name: EnsureHCNDesiredState
          display_name: "1.2B Ensure HCN Desired State"
          mode: Apply
          requires_apply_confirmation: true
          return_to_stage: 2
          max_attempts: 1
          retry_seconds: 0
          operations:
            # Onboarding safety gate. Blocks existing clustered or registered targets.
            - Test-AzureLocalDeploymentState

            # Pre-Ensure HCN validation.
            - Test-RemoteManagement
            - Test-WinRMCertificateTrust
            - Test-NodeIdentity
            - Test-AzureLocalOS
            - Test-AzureLocalPolicyState

            # Idempotent HCN desired-state enforcement.
            - Ensure-NicRoleMapping
            - Ensure-EmbeddedAdaptersDisabled
            - Ensure-DhcpDisabled
            - Ensure-ManagementVlan
            - Ensure-ManagementNetwork
            - Ensure-DNS
            - Ensure-NTP
            - Ensure-StorageNetwork
            - Ensure-IPv6Baseline
            - Ensure-LocalDeploymentAdministrator
            - Ensure-PowerShellRemoting
            - Ensure-RemoteDesktop
            - Ensure-HostName

            # Post-Ensure HCN compliance validation.
            - Test-LocalAdministratorReadiness
            - Test-LocalAdministratorCredential
            - Test-RemoteManagement
            - Test-RemoteDesktop
            - Test-AdapterDesignState
            - Test-DhcpState
            - Test-ManagementVlanState
            - Test-MellanoxDriverBaseline
            - Test-IPConfiguration
            - Test-DNS
            - Test-NTP
            - Test-StorageNetworkReadiness
            - Test-RdmaState
            - Test-SriovState
            - Test-IPv6Baseline
            - Test-ActiveDirectoryReadiness
            - Test-TpmReadiness
            - Test-SecureBoot
            - Test-RequiredWindowsFeatures
            - Test-AzureLocalOfficialConnectivityValidation
            - Test-AzureLocalOfficialHardwareValidation

        - id: 3
          name: AzureLocalNodeBootstrapReadiness
          display_name: "1.3 Azure Local Node Bootstrap Readiness"
          mode: Validate
          return_to_stage: 3
          max_attempts: 1
          retry_seconds: 0
          operations:
            - Connect-Azure
            - Test-Subscription
            - Test-Permissions
            - Test-ResourceProviders
            - Test-ResourceGroup
            - Test-LocalIdentityKeyVaultReadiness
            - Test-AzureConnectivity
            - Test-AzureGovEndpoints
            - Test-AzureLocalNodeBootstrapState

        - id: 4
          name: AzureArcMachineRegistrationAndValidation
          display_name: "1.4 Azure Arc Machine Registration and Validation"
          mode: Apply
          requires_apply_confirmation: true
          return_to_stage: 4
          max_attempts: 1
          retry_seconds: 0
          operations:
            - Connect-Azure
            - Test-Subscription
            - Test-Permissions
            - Test-ResourceProviders
            - Test-ResourceGroup
            - Test-AzureRegistrationInputs
            - Install-AzureConnectedMachineAgent
            - Invoke-AzureLocalArcInitialization
            - Register-ArcNode
            - Test-ArcRegistration
            - Test-NodeHealth
            - Test-ArcHealth

    - id: 2
      name: AzureLocalClusterDeployment
      display_name: "Phase 2 - Azure Local Cluster Deployment"
      implemented: false
      locked_until_phase: 1

      stages:
        - id: 1
          name: ClusterDeploymentInputValidation
          display_name: "2.1 Cluster Deployment Input Validation"
          mode: Validate
          return_to_stage: 1
          max_attempts: 1
          retry_seconds: 0
          operations:
            - Test-ClusterDeploymentConfiguration
            - Test-ClusterDeploymentNaming
            - Test-ClusterDeploymentNetwork
            - Test-ClusterDeploymentStorage
            - Test-ClusterDeploymentAzurePrerequisites
            - Test-ClusterDeploymentTemplateInputs
            - Test-ClusterDeploymentSafetyState

        - id: 2
          name: AzureLocalClusterDeployment
          display_name: "2.2 Azure Local Cluster Deployment"
          mode: Apply
          operations: []

        - id: 3
          name: ClusterAndStorageValidation
          display_name: "2.3 Cluster, Storage, and Control-Plane Validation"
          mode: Validate
          operations: []

    - id: 3
      name: PostDeploymentAzureLocalServices
      display_name: "Phase 3 - Post-Deployment Azure Local Services"
      implemented: false
      locked_until_phase: 2

      stages:
        - id: 1
          name: PlatformServiceValidation
          display_name: "3.1 Platform Service Validation"
          mode: Validate
          operations: []

        - id: 2
          name: WorkloadPlatformConfiguration
          display_name: "3.2 Workload Platform Configuration"
          mode: Apply
          operations: []

        - id: 3
          name: WorkloadPlatformValidation
          display_name: "3.3 Workload Platform Validation"
          mode: Validate
          operations: []

    - id: 4
      name: OperationalValidationAndCertification
      display_name: "Phase 4 - Operational Validation and Certification"
      implemented: false
      locked_until_phase: 3

      stages:
        - id: 1
          name: TestWorkloadDeployment
          display_name: "4.1 Test Workload Deployment"
          mode: Apply
          operations: []

        - id: 2
          name: WorkloadNetworkValidation
          display_name: "4.2 Workload Network Validation"
          mode: Validate
          operations: []

        - id: 3
          name: WorkloadCleanup
          display_name: "4.3 Workload Cleanup"
          mode: Apply
          operations: []

        - id: 4
          name: Certification
          display_name: "4.4 Certification"
          mode: Validate
          operations: []