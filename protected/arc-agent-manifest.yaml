arc_agent:
  installer:
    # The factory verifies this MSI on the execution workstation, transfers
    # the verified file to the target node over WinRM HTTPS, and installs it
    # only after explicit operator approval.
    source_type: ExecutionHostStagedMsi

    execution_host_path: "C:\\Build_log\\AzureConnectedMachineAgent.msi"

    file_name: AzureConnectedMachineAgent.msi

    expected_sha256: "8694ECD97E7887B5C7CC2A1541D15D2D2CB338BB39A16979BB6AF63BBA77B5D5"

    require_valid_authenticode_signature: true

    expected_signer_subject: "CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"

    expected_signer_issuer: "CN=Microsoft Code Signing PCA 2011, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"

    expected_signer_thumbprint: "F9A7CF9FBE13BAC767F4781061332DA6E8B4E0EE"

    # Hash is the immutable artifact identity. Leave null until the MSI
    # ProductVersion is captured through Windows Installer metadata.
    expected_product_version: null

    node_staging_directory: "C:\\Build_log\\ArcAgent\\Staging"

    install_log_directory: "C:\\Build_log\\ArcAgent"

    install_arguments:
      - /i
      - "{InstallerPath}"
      - /qn
      - /norestart
      - /l*v
      - "{InstallLogPath}"

    accepted_exit_codes:
      - 0
      - 3010

  behavior:
    require_explicit_approval: true

    allow_automatic_upgrade: false

    allow_reinstall_when_agent_present: false

    allow_agent_install_without_arc_registration: true

    require_post_install_himds_running: true

    require_post_install_azcmagent: true

    prohibit_azcmagent_connect_during_install: true

    prohibit_extension_install_during_install: true